name: ci
on:
  push:
    branches: [master]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      # This plugin depends on herrscher-contracts and herrscher-orchestrator. A
      # PR often rides on unpublished sibling commits, so build against the
      # matching refs via go.work: each sibling's branch of the same name when it
      # exists, else its default. Falls back to the pinned go.mod versions.
      - name: Check out herrscher-contracts
        uses: actions/checkout@v4
        with:
          repository: Herrscherd/herrscher-contracts
          ref: ${{ github.head_ref }}
          path: _deps/herrscher-contracts
          token: ${{ secrets.CONTRACTS_TOKEN || github.token }}
        continue-on-error: true

      - name: Check out herrscher-orchestrator
        uses: actions/checkout@v4
        with:
          repository: Herrscherd/herrscher-orchestrator
          ref: ${{ github.head_ref }}
          path: _deps/herrscher-orchestrator
          token: ${{ secrets.CONTRACTS_TOKEN || github.token }}
        continue-on-error: true

      - name: Use local siblings when present
        run: |
          mods=(.)
          [ -d _deps/herrscher-contracts ] && mods+=(_deps/herrscher-contracts)
          [ -d _deps/herrscher-orchestrator ] && mods+=(_deps/herrscher-orchestrator)
          if [ ${#mods[@]} -gt 1 ]; then
            go work init "${mods[@]}"
          fi

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
